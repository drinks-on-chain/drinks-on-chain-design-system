name: Release

# Publica el paquete como tarball adjunto a una GitHub Release (sin registro npm).
# Se dispara al empujar una etiqueta vX.Y.Z creada sobre main, o una pre-release
# vX.Y.Z-rc.N creada sobre dev (plan/03 §3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, pack y GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vX.Y.Z exige package.json = X.Y.Z. Una pre-release vX.Y.Z-rc.N vale con package.json =
      # X.Y.Z (la versión que prepara dev) o X.Y.Z-rc.N; el tarball se empaqueta como X.Y.Z-rc.N.
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            "$PKG") ;;
            "$PKG"-*) npm pkg set version="$TAG" ;;
            *)
              echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $PKG de package.json"
              exit 1
              ;;
          esac
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          echo "BASE_VERSION=${TAG%%-*}" >> "$GITHUB_ENV"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Empaquetar
        run: pnpm pack

      # Sección de la versión exacta o, en una pre-release, la de la versión que prepara.
      - name: Notas desde CHANGELOG.md
        run: |
          notes() {
            awk -v v="$1" '
              index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }
          notes "$VERSION" > release-notes.md
          if [ ! -s release-notes.md ]; then notes "$BASE_VERSION" > release-notes.md; fi
          if [ ! -s release-notes.md ]; then echo "Versión $VERSION" > release-notes.md; fi

      - name: Crear la GitHub Release con el tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Las versiones con guion (X.Y.Z-rc.N) se publican como pre-release, nunca como «Latest».
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "drinks-on-chain-ui-$VERSION.tgz" \
            --title "@drinks-on-chain/ui $VERSION" \
            --notes-file release-notes.md \
            --verify-tag $PRERELEASE
